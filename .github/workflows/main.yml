name: EC2 auto deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Public IP Install
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ./backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build frontend
        working-directory: ./backend
        run: npm run build

      - name: AWS set Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy
        run: |
          # SSHポートを一時的に開放
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

          # 秘密鍵をセットアップ
          echo "${{ secrets.PRIVATE_KEY }}" > private_key
          chmod 600 private_key

          # 成功・失敗問わずSSHポートを閉じる
          trap 'aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32' EXIT

          # ビルド済みアセットをEC2に転送
          scp -o StrictHostKeyChecking=no -i private_key -r backend/public/build \
            ${{ secrets.USER_NAME }}@${{ secrets.HOST_NAME }}:/home/ec2-user/tripost/backend/public/

          # SSH接続 → デプロイ処理
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -i private_key ${{ secrets.USER_NAME }}@${{ secrets.HOST_NAME }} << 'EOF'
            cd /home/ec2-user/tripost/backend || { echo "ディレクトリ移動失敗"; exit 1; }

            git remote set-url origin https://github.com/sookoo19/Tripost.git
            git fetch --prune || { echo "git fetch失敗"; exit 1; }
            git checkout main || { echo "git checkout失敗"; exit 1; }
            git reset --hard HEAD
            git clean -fd
            git pull origin main || { echo "git pull失敗"; exit 1; }

            docker compose -f docker-compose.production.yml up -d --build || { echo "docker-compose失敗"; exit 1; }

            # ビルド後の権限修正
            docker compose -f docker-compose.production.yml exec -T laravel chown -R www-data:www-data public/build || { echo "権限修正失敗"; exit 1; }

            # キャッシュクリア
            docker compose -f docker-compose.production.yml exec -T laravel bash -lc "
              rm -rf storage/framework/views/* &&
              rm -rf bootstrap/cache/*.php &&
              php artisan optimize:clear &&
              php artisan config:cache &&
              php artisan route:cache &&
              php artisan view:cache
            " || { echo "キャッシュクリア失敗"; exit 1; }

            # ストレージの権限確保
            docker compose -f docker-compose.production.yml exec -T laravel chown -R www-data:www-data storage || { echo "ストレージ権限修正失敗"; exit 1; }

            # コンテナ再起動
            docker compose -f docker-compose.production.yml restart || { echo "コンテナ再起動失敗"; exit 1; }
          EOF
