name: Laravel Test CI (MySQL)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  laravel-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, xml, bcmath, intl

      - name: Install composer deps
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot >/dev/null 2>&1; then
              echo "MySQL is up"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Prepare testing env
        run: |
          cp .env.example .env
          cat > .env.testing << 'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=testing
          DB_USERNAME=sail
          DB_PASSWORD=password
          MAIL_MAILER=log
          SESSION_DRIVER=array
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          EOF
          php artisan key:generate --env=testing --no-interaction

      - name: Ensure storage writable
        run: |
          mkdir -p storage/logs bootstrap/cache
          chmod -R 0777 storage bootstrap/cache

      - name: Migrate
        env:
          APP_ENV: testing
        run: php artisan migrate --env=testing --no-interaction

      - name: Run tests
        env:
          APP_ENV: testing
        run: vendor/bin/phpunit --colors=never --verbose

      - name: Dump Laravel log for debugging
        if: failure()
        run: |
          echo "=== storage/logs ==="
          ls -la storage/logs || true
          for file in storage/logs/*.log; do
            if [ -f "$file" ]; then
              echo "---- $file ----"
              head -n 400 "$file"
            fi
          done
