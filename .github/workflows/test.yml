name: Docker Laravel Test CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  laravel-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: backend_tripost/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend_tripost/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Composer の依存関係を先にインストール（Sail を含む）
      - name: Install Composer dependencies
        working-directory: ./backend_tripost
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 環境変数の設定
      - name: Setup environment variables
        working-directory: ./backend_tripost
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=mysql/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=sail/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Docker Compose Build and Up
        working-directory: ./backend_tripost
        run: |
          docker compose build
          docker compose up -d
          sleep 20

      - name: Docker Compose Process
        working-directory: ./backend_tripost
        run: docker compose ps -a

      - name: PHP, Composer Version
        working-directory: ./backend_tripost
        run: |
          docker compose exec -T laravel.test php --version
          docker compose exec -T laravel.test composer --version

      - name: Laravel Settings
        working-directory: ./backend_tripost
        run: |
          docker compose exec -T laravel.test php artisan key:generate --force
          docker compose exec -T laravel.test php artisan optimize
          docker compose exec -T laravel.test chmod -R 777 storage bootstrap/cache

      - name: Laravel Version
        working-directory: ./backend_tripost
        run: docker compose exec -T laravel.test php artisan --version

      - name: Laravel Migrate Testing
        working-directory: ./backend_tripost
        run: docker compose exec -T laravel.test php artisan migrate --force

      - name: Laravel Rollback Testing
        working-directory: ./backend_tripost
        run: docker compose exec -T laravel.test php artisan migrate:refresh --force

      - name: Laravel Seeding Testing
        working-directory: ./backend_tripost
        run: docker compose exec -T laravel.test php artisan db:seed --force

      - name: Laravel PHPUnit Testing
        working-directory: ./backend_tripost
        run: |
          docker compose exec -T laravel.test php artisan config:clear
          docker compose exec -T laravel.test php artisan test

      - name: Cleanup
        if: always()
        working-directory: ./backend_tripost
        run: docker compose down -v
