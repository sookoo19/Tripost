name: Docker Laravel Test CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 作業ディレクトリを明示的に指定
    defaults:
      run:
        working-directory: ./backend_tripost

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Docker キャッシュの設定
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ファイル確認（デバッグ用）
      - name: List files
        run: |
          pwd
          ls -la

      # .env.testing ファイルのセットアップ
      - name: Setup environment
        run: |
          if [ ! -f .env.example ]; then
            echo ".env.example not found!"
            exit 1
          fi
          cp .env.example .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=mysql/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=testing/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=sail/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env.testing

      # Docker Compose ファイルの確認
      - name: Check Docker Compose files
        run: |
          ls -la docker-compose*.yml || echo "No docker-compose files found"

      # Docker Compose を使ってコンテナをビルド・起動
      - name: Build and start Docker containers
        run: |
          # docker-compose.yml または docker-compose.dev.yml を使用
          if [ -f docker-compose.yml ]; then
            COMPOSE_FILE="docker-compose.yml"
          elif [ -f docker-compose.dev.yml ]; then
            COMPOSE_FILE="docker-compose.dev.yml"
          else
            echo "No docker-compose file found"
            exit 1
          fi
          
          docker compose -f $COMPOSE_FILE build
          docker compose -f $COMPOSE_FILE up -d

      # コンテナの起動を待機
      - name: Wait for containers to be ready
        run: |
          echo "Waiting for containers to be ready..."
          sleep 10
          docker ps -a

      # Laravelコンテナ名の確認
      - name: Detect Laravel container name
        id: container
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'laravel|app|php' | head -n 1)
          if [ -z "$CONTAINER" ]; then
            echo "Laravel container not found!"
            docker ps -a
            exit 1
          fi
          echo "container=$CONTAINER" >> $GITHUB_OUTPUT
          echo "Found container: $CONTAINER"

      # Composer パッケージのインストール
      - name: Install Composer dependencies
        run: docker exec -t ${{ steps.container.outputs.container }} composer install --no-progress --no-interaction

      # アプリケーションのセットアップ
      - name: Prepare Laravel application
        run: |
          docker exec -t ${{ steps.container.outputs.container }} cp .env.testing .env
          docker exec -t ${{ steps.container.outputs.container }} php artisan key:generate
          docker exec -t ${{ steps.container.outputs.container }} php artisan migrate:fresh --seed --force

      # コード品質チェック（Pint がインストールされている場合）
      - name: Check code quality
        continue-on-error: true
        run: |
          if docker exec -t ${{ steps.container.outputs.container }} test -f ./vendor/bin/pint; then
            docker exec -t ${{ steps.container.outputs.container }} ./vendor/bin/pint --test
          else
            echo "Pint not installed, skipping..."
          fi

      # PHPUnit テストの実行
      - name: Run tests
        run: docker exec -t ${{ steps.container.outputs.container }} php artisan test

      # フロントエンド関連のセットアップとテスト
      - name: Frontend setup and build
        run: |
          docker exec -t ${{ steps.container.outputs.container }} npm ci
          docker exec -t ${{ steps.container.outputs.container }} npm run build

      # コンテナのログ確認（テスト失敗時のデバッグ用）
      - name: Display container logs on failure
        if: failure()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml logs
          elif [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml logs
          fi

      # コンテナの停止・削除
      - name: Stop and remove containers
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml down -v
          elif [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml down -v
          fi
