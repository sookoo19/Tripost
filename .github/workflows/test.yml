name: Docker Laravel Test CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  laravel-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: backend_tripost/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend_tripost/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Docker Compose Build and Up
        working-directory: ./backend_tripost
        run: |
          docker compose build
          docker compose up -d
          sleep 10

      - name: Docker Compose Process
        working-directory: ./backend_tripost
        run: docker compose ps -a

      - name: PHP, Composer Version
        working-directory: ./backend_tripost
        run: |
          docker compose exec -T laravel.test php --version
          docker compose exec -T laravel.test composer --version

      - name: Composer Install
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./backend_tripost
        run: docker compose exec -T laravel.test composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist

      # 以下、laravel.test に合わせて同様に exec コマンドを更新してください
